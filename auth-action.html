<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>BetterInternet · Account</title><link rel="icon" href="./favicon.svg"><style>*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:#f5f5f7;color:#111;font:16px system-ui,-apple-system,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}main{width:min(100%,460px);background:#fff;border:1px solid #e1e4eb;border-radius:24px;padding:36px;box-shadow:0 12px 40px #1111}header{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:700}img{width:36px;height:36px}h1{font-size:30px;letter-spacing:-1px;margin-top:30px}p{line-height:1.6;color:#515866}button,a{display:block;border:0;border-radius:10px;padding:12px 16px;background:#3155d9;color:#fff;text-align:center;text-decoration:none;font:600 15px system-ui;width:100%;cursor:pointer;margin-top:12px}button:disabled{opacity:.55}input{border:1px solid #ccd2de;padding:12px;border-radius:10px;width:100%;font:inherit;margin:8px 0}footer{font-size:12px;color:#64748b;margin-top:24px}</style></head><body><main><header><img src="./favicon.svg" alt="">BetterInternet</header><h1 id="heading">Checking your link…</h1><p id="message" role="status">Please keep this page open.</p><div id="form"></div><a id="back" href="./studio" hidden>Return to BetterInternet</a><footer>Smarter networks. Better connections.</footer></main><script type="module">
import {firebaseConfig} from './firebase-config.js';
import {connect} from './cloud-sdk.js';
const $=id=>document.getElementById(id);const params=new URLSearchParams(location.search),mode=params.get('mode'),code=params.get('oobCode');history.replaceState({},'',location.pathname);function say(title,detail,back=true){$('heading').textContent=title;$('message').textContent=detail;$('back').hidden=!back}try{if(!code||!firebaseConfig.apiKey)throw Error('Invalid');let sdk=connect(firebaseConfig);if(mode==='verifyEmail'){await sdk.applyCode(code);try{await sdk.refresh()}catch{}$('back').href='./studio?verified=1';say('Email verified','Your BetterInternet account is ready. Return to your workspace to continue.')}else if(mode==='resetPassword'){await sdk.checkReset(code);say('Choose a new password','Use at least six characters.',false);let form=document.createElement('form');form.innerHTML='<label for="newpw">New password</label><input id="newpw" type="password" autocomplete="new-password" minlength="6" required><button>Reset password</button>';$('form').append(form);form.onsubmit=async e=>{e.preventDefault();form.querySelector('button').disabled=true;try{await sdk.confirmReset(code,$('newpw').value);form.remove();say('Password updated','Sign in with your new password.')}catch{say('Could not reset password','Request a new reset link if this one expired.');form.querySelector('button').disabled=false}}}else if(mode==='recoverEmail'){await sdk.checkCode(code);await sdk.applyCode(code);say('Email restored','Your original email address has been restored. Review your account and reset your password if needed.')}else throw Error('Invalid mode')}catch(e){say('This link could not be completed','The link may be expired, used, or invalid. Return to BetterInternet and request a new email.')}
</script></body></html>
